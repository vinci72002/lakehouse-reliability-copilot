[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-reliability-copilot"
version = "0.2.0"
description = "AI-assisted data reliability platform for aircraft telemetry in a lakehouse."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deltalake>=1.0.0",
    "fastapi>=0.115",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pyspark>=3.5,<3.6",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
